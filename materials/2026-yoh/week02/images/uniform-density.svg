<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" role="img" aria-labelledby="title desc">
  <title id="title">0〜6時間の一様分布</title>
  <desc id="desc">横軸は時間、縦軸は確率密度。0から6まで高さは6分の1。全体の面積は1。2から3の1時間を濃い青で示し、面積は6分の1。</desc>
  <g font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" fill="#17374b">
    <text x="22" y="30" font-size="23">確率密度</text>
    <text x="151" y="30" font-family="Times New Roman, serif" font-style="italic" font-size="26">f(x)</text>
    <rect x="80" y="100" width="420" height="160" fill="#d4eaf5"/>
    <rect x="220" y="100" width="70" height="160" fill="#4aa8cd"/>
    <path d="M80 100H500" fill="none" stroke="#287c9f" stroke-width="4"/>
    <path d="M80 100V260M500 100V260" fill="none" stroke="#287c9f" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M80 55V260H530" fill="none" stroke="#17374b" stroke-width="2.5"/>
    <path d="M75 62L80 52L85 62M520 255L530 260L520 265" fill="none" stroke="#17374b" stroke-width="2.5"/>
    <text x="22" y="108" font-family="Times New Roman, serif" font-size="29">1/6</text>
    <text x="46" y="268" font-size="22">0</text>
    <g font-size="22" text-anchor="middle">
      <path d="M80 260V267M150 260V267M220 260V267M290 260V267M360 260V267M430 260V267M500 260V267" stroke="#17374b" stroke-width="2"/>
      <text x="80" y="292">0</text><text x="150" y="292">1</text><text x="220" y="292">2</text><text x="290" y="292">3</text><text x="360" y="292">4</text><text x="430" y="292">5</text><text x="500" y="292">6</text>
    </g>
    <text x="290" y="331" font-size="23" text-anchor="middle">配達時間 x（時間）</text>
    <text x="310" y="151" font-size="23">全体の面積</text>
    <text x="310" y="190" font-family="Times New Roman, serif" font-size="29">6 × 1/6 = 1</text>
    <text x="310" y="223" font-size="23">100%</text>
    <path d="M255 100V63H310" fill="none" stroke="#287c9f" stroke-width="2"/>
    <text x="319" y="69" font-size="21">1時間分 = 16.67%</text>
    <text x="280" y="377" font-size="20" text-anchor="middle">高さではなく、区間の面積が確率。</text>
  </g>
</svg>
