<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" role="img" aria-labelledby="title desc">
<title id="title">ロボットの1日の配達件数：授業用の確率分布</title>
<desc id="desc">0件の確率25％、1件50％、2件25％。期待値は1件。</desc>
<g font-family="Arial,Hiragino Sans,sans-serif" fill="#425560" font-size="19">
<text x="65" y="28" font-weight="bold">ロボットの配達件数（授業用の仮定）</text>
<text x="12" y="63">確率</text>
<path d="M65 60V280H660" fill="none" stroke="#61737c" stroke-width="2"/>
<path d="M65 180H660M65 80H660" stroke="#dce3e3"/>
<text x="55" y="286" text-anchor="end">0</text><text x="55" y="186" text-anchor="end">25％</text><text x="55" y="86" text-anchor="end">50％</text>
<rect x="135" y="180" width="90" height="100" fill="#176d82"/>
<rect x="315" y="80" width="90" height="200" fill="#287f74"/>
<rect x="495" y="180" width="90" height="100" fill="#176d82"/>
<text x="180" y="167" text-anchor="middle">0.25</text><text x="360" y="67" text-anchor="middle">0.50</text><text x="540" y="167" text-anchor="middle">0.25</text>
<text x="180" y="308" text-anchor="middle">0件</text><text x="360" y="308" text-anchor="middle">1件</text><text x="540" y="308" text-anchor="middle">2件</text>
<text x="360" y="337" text-anchor="middle" fill="#176d82">μ = 1件（分布の中心）</text>
</g></svg>
