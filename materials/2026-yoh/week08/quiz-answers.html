><ruby>平<rt>へい</rt></ruby><ruby>均<rt>きん</rt></ruby>の<ruby>点<rt>てん</rt></ruby><ruby>推<rt>すい</rt></ruby><ruby>定<rt>てい</rt></ruby>値は10分。未知の<ruby>母<rt>ぼ</rt></ruby><ruby>平<rt>へい</rt></ruby><ruby>均<rt>きん</rt></ruby>そのものを確定したわけではない。</p><figure><svg role="img" aria-label="横の位置は配達時間。8分と9分は重ならないよう上下にずらして表示。" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430"><g font-family="Arial,Hiragino Sans,sans-serif" fill="#263f47"><text x="550" y="30" text-anchor="middle" font-size="26">架空の5件の配達</text><path d="M100 275H1000" stroke="#6e858a" stroke-width="2"/><path d="M100 275v9" stroke="#6e858a" stroke-width="2"/><text x="100" y="315" text-anchor="middle" font-size="29">0</text><path d="M325 275v9" stroke="#6e858a" stroke-width="2"/><text x="325" y="315" text-anchor="middle" font-size="29">5</text><path d="M550 275v9" stroke="#6e858a" stroke-width="2"/><text x="550" y="315" text-anchor="middle" font-size="29">10</text><path d="M775 275v9" stroke="#6e858a" stroke-width="2"/><text x="775" y="315" text-anchor="middle" font-size="29">15</text><path d="M1000 275v9" stroke="#6e858a" stroke-width="2"/><text x="1000" y="315" text-anchor="middle" font-size="29">20</text><text x="1065" y="315" text-anchor="end" font-size="27">分</text><path d="M550 65V275" stroke="#bd753b" stroke-dasharray="6 6" stroke-width="3"/><path d="M325 143V275" stroke="#a6b9b8" stroke-width="2" stroke-dasharray="4 5"/><g transform="translate(325,112)"><g transform="scale(.65)"><rect x="-47" y="-33" width="94" height="62" rx="13" fill="#a9cecc"/><rect x="-34" y="-18" width="68" height="29" rx="6" fill="#507e87"/><circle cx="-17" cy="-4" r="5" fill="white"/><circle cx="17" cy="-4" r="5" fill="white"/><circle cx="-27" cy="34" r="13" fill="#344f56"/><circle cx="27" cy="34" r="13" fill="#344f56"/></g><text y="-38" text-anchor="middle" font-size="34">5分</text></g><circle cx="325" cy="275" r="5" fill="#507e87"/><path d="M460 143V275" stroke="#a6b9b8" stroke-width="2" stroke-dasharray="4 5"/><g transform="translate(460,112)"><g transform="scale(.65)"><rect x="-47" y="-33" width="94" height="62" rx="13" fill="#a9cecc"/><rect x="-34" y="-18" width="68" height="29" rx="6" fill="#507e87"/><circle cx="-17" cy="-4" r="5" fill="white"/><circle cx="17" cy="-4" r="5" fill="white"/><circle cx="-27" cy="34" r="13" fill="#344f56"/><circle cx="27" cy="34" r="13" fill="#344f56"/></g><text y="-38" text-anchor="middle" font-size="34">8分</text></g><circle cx="460" cy="275" r="5" fill="#507e87"/><path d="M505 219V275" stroke="#a6b9b8" stroke-width="2" stroke-dasharray="4 5"/><g transform="translate(505,188)"><g transform="scale(.65)"><rect x="-47" y="-33" width="94" height="62" rx="13" fill="#a9cecc"/><rect x="-34" y="-18" width="68" height="29" rx="6" fill="#507e87"/><circle cx="-17" cy="-4" r="5" fill="white"/><circle cx="17" cy="-4" r="5" fill="white"/><circle cx="-27" cy="34" r="13" fill="#344f56"/><circle cx="27" cy="34" r="13" fill="#344f56"/></g><text y="-38" text-anchor="middle" font-size="34">9分</text></g><circle cx="505" cy="275" r="5" fill="#507e87"/><path d="M640 143V275" stroke="#a6b9b8" stroke-width="2" stroke-dasharray="4 5"/><g transform="translate(640,112)"><g transform="scale(.65)"><rect x="-47" y="-33" width="94" height="62" rx="13" fill="#a9cecc"/><rect x="-34" y="-18" width="68" height="29" rx="6" fill="#507e87"/><circle cx="-17" cy="-4" r="5" fill="white"/><circle cx="17" cy="-4" r="5" fill="white"/><circle cx="-27" cy="34" r="13" fill="#344f56"/><circle cx="27" cy="34" r="13" fill="#344f56"/></g><text y="-38" text-anchor="middle" font-size="34">12分</text></g><circle cx="640" cy="275" r="5" fill="#507e87"/><path d="M820 143V275" stroke="#a6b9b8" stroke-width="2" stroke-dasharray="4 5"/><g transform="translate(820,112)"><g transform="scale(.65)"><rect x="-47" y="-33" width="94" height="62" rx="13" fill="#a9cecc"/><rect x="-34" y="-18" width="68" height="29" rx="6" fill="#507e87"/><circle cx="-17" cy="-4" r="5" fill="white"/><circle cx="17" cy="-4" r="5" fill="white"/><circle cx="-27" cy="34" r="13" fill="#344f56"/><circle cx="27" cy="34" r="13" fill="#344f56"/></g><text y="-38" text-anchor="middle" font-size="34">16分</text></g><circle cx="820" cy="275" r="5" fill="#507e87"/><text x="550" y="395" text-anchor="middle" font-size="40" fill="#a9602a">標本平均 10分</text></g></svg><figcaption>横の位置は配達時間。8分と9分は重ならないよう上下にずらして表示。</figcaption></figure></article><article class="worked"><h3>②・③に使う偏差二乗和</h3><div class="table-wrap"><table><thead><tr><th>時間 Xᵢ（分）</th><th>偏差 Xᵢ − X̄（分）</th><th>偏差二乗 (Xᵢ − X̄)²（分²）</th></tr></thead><tbody><tr><td>5</td><td>-5</td><td>25</td></tr><tr><td>8</td><td>-2</td><td>4</td></tr><tr><td>9</td><td>-1</td><td>1</td></tr><tr><td>12</td><td>2</td><td>4</td></tr><tr><td>16</td><td>6</td><td>36</td></tr></tbody><tfoot><tr><th>合計</th><td>0</td><td>70</td></tr></tfoot></table></div><div class="math">\[\sum(X_i-\bar X)^2=25+4+1+4+36=70\ \text{分}^2\]</div><figure><svg role="img" aria-label="各配達が偏差二乗和70分²に寄与する大きさ。" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430"><g font-family="Arial,Hiragino Sans,sans-serif" fill="#263f47"><text x="40" y="35" font-size="26">平均との差の二乗 ／ 分²</text><path d="M70 325H1040" stroke="#9baeb0"/><rect x="90" y="186.11111111111111" width="100" height="138.88888888888889" fill="#287e79"/><text x="140" y="171.11111111111111" text-anchor="middle" font-size="25">25</text><text x="140" y="375" text-anchor="middle" font-size="23">5分</text><rect x="274" y="302.77777777777777" width="100" height="22.22222222222222" fill="#c37a41"/><text x="324" y="287.77777777777777" text-anchor="middle" font-size="25">4</text><text x="324" y="375" text-anchor="middle" font-size="23">8分</text><rect x="458" y="319.44444444444446" width="100" height="5.555555555555555" fill="#287e79"/><text x="508" y="304.44444444444446" text-anchor="middle" font-size="25">1</text><text x="508" y="375" text-anchor="middle" font-size="23">9分</text><rect x="642" y="302.77777777777777" width="100" height="22.22222222222222" fill="#c37a41"/><text x="692" y="287.77777777777777" text-anchor="middle" font-size="25">4</text><text x="692" y="375" text-anchor="middle" font-size="23">12分</text><rect x="826" y="125" width="100" height="200" fill="#287e79"/><text x="876" y="110" text-anchor="middle" font-size="25">36</text><text x="876" y="375" text-anchor="middle" font-size="23">16分</text></g></svg><figcaption>各配達が偏差二乗和70分²に寄与する大きさ。</figcaption></figure></article><article class="worked"><h3>② この5件の<ruby>標<rt>ひょう</rt></ruby><ruby>本<rt>ほん</rt></ruby><ruby>分<rt>ぶん</rt></ruby><ruby>散<rt>さん</rt></ruby></h3><h4>① 与えられた条件 <span>Given</span></h4><p>n＝5、偏差二乗和70分²。</p><h4>② 公式 <span>Formula</span></h4><div class="math">\[S^2=\frac1n\sum_{i=1}^n(X_i-\bar X)^2\]</div><h4>③ 代入・計算 <span>Substitute</span></h4><div class="math">\[S^2=\frac{70}{5}=14\ \text{分}^2\]</div><h4>④ 答え <span>Result</span></h4><p class="result"><ruby>標<rt>ひょう</rt></ruby><ruby>本<rt>ほん</rt></ruby><ruby>分<rt>ぶん</rt></ruby><ruby>散<rt>さん</rt></ruby>は14分²。今回の5件の散らばりを記述する。</p></article><article class="worked"><h3>③ <ruby>標<rt>ひょう</rt></ruby><ruby>本<rt>ほん</rt></ruby><ruby>不<rt>ふ</rt></ruby><ruby>偏<rt>へん</rt></ruby><ruby>分<rt>ぶん</rt></ruby><ruby>散<rt>さん</rt></ruby>と、<ruby>母<rt>ぼ</rt></ruby><ruby>分<rt>ぶん</rt></ruby><ruby>散<rt>さん</rt></ruby>の<ruby>点<rt>てん</rt></ruby><ruby>推<rt>すい</rt></ruby><ruby>定<rt>てい</rt></ruby>値</h3><h4>① 与えられた条件 <span>Given</span></h4><p>n＝5、偏差二乗和70分²。</p><h4>② 公式 <span>Formula</span></h4><div class="math">\[\widehat{\sigma_x^2}=\frac1{n-1}\sum_{i=1}^n(X_i-\bar X)^2\]</div><h4>③ 代入・計算 <span>Substitute</span></h4><div class="math">\[\widehat{\sigma_x^2}=\frac{70}{5-1}=\frac{70}{4}=17.5\ \text{分}^2\]</div><h4>④ 答え <span>Result</span></h4><p class="result"><ruby>母<rt>ぼ</rt></ruby><ruby>分<rt>ぶん</rt></ruby><ruby>散<rt>さん</rt></ruby>の<ruby>点<rt>てん</rt></ruby><ruby>推<rt>すい</rt></ruby><ruby>定<rt>てい</rt></ruby>値は17.5分²。<ruby>母<rt>ぼ</rt></ruby><ruby>分<rt>ぶん</rt></ruby><ruby>散<rt>さん</rt></ruby>を不偏に推定するため、n−1で割る。</p><figure><svg role="img" aria-label="同じ偏差二乗和を、nで割るか、n−1で割るか。" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430"><g font-family="Arial,Hiragino Sans,sans-serif" fill="#263f47"><text x="40" y="35" font-size="26">同じ5件、同じ偏差二乗和70分²</text><path d="M70 325H1040" stroke="#9baeb0"/><rect x="90" y="165" width="100" height="160" fill="#287e79"/><text x="140" y="150" text-anchor="middle" font-size="25">14</text><text x="140" y="375" text-anchor="middle" font-size="23">標本分散</text><rect x="550" y="125" width="100" height="200" fill="#c37a41"/><text x="600" y="110" text-anchor="middle" font-size="25">17.5</text><text x="600" y="375" text-anchor="middle" font-size="23">標本不偏分散</text></g></svg><figcaption>同じ偏差二乗和を、nで割るか、n−1で割るか。</figcaption></figure></article></section><section id="q3" class="question"><h2><span>問3</span>Curryの5試合</h2><article class="worked"><h3>① T値と<ruby>自<rt>じ</rt></ruby><ruby>由<rt>ゆう</rt></ruby><ruby>度<rt>ど</rt></ruby></h3><h4>① 与えられた条件 <span>Given</span></h4><p><ruby>標<rt>ひょう</rt></ruby><ruby>本<rt>ほん</rt></ruby><ruby>平<rt>へい</rt></ruby><ruby>均<rt>きん</rt></ruby>32点、<ruby>標<rt>ひょう</rt></ruby><ruby>本<rt>ほん</rt></ruby><ruby>不<rt>ふ</rt></ruby><ruby>偏<rt>へん</rt></ruby><ruby>分<rt>ぶん</rt></ruby><ruby>散<rt>さん</rt></ruby>20点²、n＝5。正規<ruby>母<rt>ぼ</rt></ruby><ruby>集<rt>しゅう</rt></ruby><ruby>団<rt>だん</rt></ruby>の<ruby>母<rt>ぼ</rt></ruby><ruby>平<rt>へい</rt></ruby><ruby>均<rt>きん</rt></ruby>28点、<ruby>母<rt>ぼ</rt></ruby><ruby>分<rt>ぶん</rt></ruby><ruby>散<rt>さん</rt></ruby>は未知。</p><h4>② 公式 <span>Formula</span></h4><div class="math">\[T=\frac{\bar X-\mu_x}{\sqrt{\widehat{\sigma_x^2}/n}},\qquad\nu=n-1\]</div><h4>③ 代入・計算 <span>Substitute</span></h4><div class="math">\[T=\frac{32-28}{\sqrt{20/5}}=\frac42=2.00,\qquad\nu=5-1=4\]</div><h4>④ 答え <span>Result</span></h4><p class="result">T＝2.00、<ruby>自<rt>じ</rt></ruby><ruby>由<rt>ゆう</rt></ruby><ruby>度<rt>ど</rt></ruby>4。Tは標準化した位置であり、確率ではない。</p></article><article class="worked"><h3>② 中央95％の範囲の両端</h3><h4>① 与えられた条件 <span>Given</span></h4><p><ruby>自<rt>じ</rt></ruby><ruby>由<rt>ゆう</rt></ruby><rub
