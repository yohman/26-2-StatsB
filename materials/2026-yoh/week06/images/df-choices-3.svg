<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" role="img" aria-label="四つの値の平均を3に固定。2、5、1を選ぶと残りは4に決まる。"><g font-family="Arial,Hiragino Sans,sans-serif" text-anchor="middle"><rect x="45" y="20" width="215" height="155" rx="4" fill="#edf7fa" stroke="#176d82" stroke-width="3"/><text x="152.5" y="126" font-size="83" fill="#176d82">2</text><text x="152.5" y="218" font-size="23" fill="#176d82">自由に選ぶ</text><text x="152.5" y="247" font-size="17" fill="#176d82">Free choice</text><rect x="310" y="20" width="215" height="155" rx="4" fill="#fff1e3" stroke="#b96930" stroke-width="3"/><text x="417.5" y="126" font-size="83" fill="#b96930">4</text><text x="417.5" y="218" font-size="23" fill="#b96930">選べない → 4に決まる</text><text x="417.5" y="247" font-size="17" fill="#b96930">Forced by the total</text><rect x="575" y="20" width="215" height="155" rx="4" fill="#edf7fa" stroke="#176d82" stroke-width="3"/><text x="682.5" y="126" font-size="83" fill="#176d82">5</text><text x="682.5" y="218" font-size="23" fill="#176d82">自由に選ぶ</text><text x="682.5" y="247" font-size="17" fill="#176d82">Free choice</text><rect x="840" y="20" width="215" height="155" rx="4" fill="#edf7fa" stroke="#176d82" stroke-width="3"/><text x="947.5" y="126" font-size="83" fill="#176d82">1</text><text x="947.5" y="218" font-size="23" fill="#176d82">自由に選ぶ</text><text x="947.5" y="247" font-size="17" fill="#176d82">Free choice</text></g></svg>