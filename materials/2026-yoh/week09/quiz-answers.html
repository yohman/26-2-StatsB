<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Week 9 · 期末試験形式クイズ</title><link rel="icon" href="../../../favicon.svg"><link rel="stylesheet" href="../week08/quiz.css"><script src="../../../assets/preview-access.js"></script><script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script></head><body><main id="gate" class="gate"><a href="quiz.html?p">← 問題</a><h1>答え合わせ</h1><form id="unlock-form"><label for="unlock-word">合言葉を入力</label><div class="unlock-row"><input id="unlock-word" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required><button type="submit">開く →</button></div><p id="unlock-error" role="status" aria-live="polite"></p></form></main><template id="answer-content"><nav class="page-nav"><a href="index.html?p">← Week 9</a><div><a href="#q1">問1</a><a href="#q2">問2</a><a href="#q3">問3</a></div></nav><main tabindex="-1" id="answers-main"><header><p class="eyebrow">WEEK 9 · 答え合わせ</p><h1>上<ruby>下<rt>か</rt></ruby><ruby>限<rt>げん</rt></ruby>まで、計算する。</h1><a href="quiz.html?p">問題に戻る →</a><div class="table-links"><a href="../week06/t-table.html?p" target="_blank" rel="noopener">t分布表 ↗</a><a href="../shared/chi-table.html?p" target="_blank" rel="noopener">χ²分布表 ↗</a><a href="../week05/normal-upper-tail-table.html?p" target="_blank" rel="noopener">標準正規分布表 ↗</a></div></header><section id="q1" class="question"><h2><span>問1</span>ロボットの配送時間</h2><article class="worked"><h3>① <ruby>不<rt>ふ</rt></ruby><ruby>偏<rt>へん</rt></ruby><ruby>分<rt>ぶん</rt></ruby><ruby>散<rt>さん</rt></ruby></h3><h4>① 与えられた条件 <span>Given</span></h4><p>n = 25、nで割った<ruby>標<rt>ひょう</rt></ruby><ruby>本<rt>ほん</rt></ruby><ruby>分<rt>ぶん</rt></ruby><ruby>散<rt>さん</rt></ruby> S² = 3.84分²。</p><h4>② 公式 <span>Formula</span></h4><div class="math">\[\widehat{\sigma_x^2}=\frac{n}{n-1}S^2\]</div><h4>③ 代入・計算 <span>Substitute</span></h4><div class="math">\[\widehat{\sigma_x^2}=\frac{25\times3.84}{24}=\frac{96}{24}=4\]</div><h4>④ 答え <span>Result</span></h4><p class="result">4分²。<ruby>偏<rt>へん</rt></ruby><ruby>差<rt>さ</rt></ruby><ruby>二<rt>に</rt></ruby><ruby>乗<rt>じょう</rt></ruby><ruby>和<rt>わ</rt></ruby>96を、24で割る。</p><div class="lookup"><span><ruby>偏<rt>へん</rt></ruby><ruby>差<rt>さ</rt></ruby><ruby>二<rt>に</rt></ruby><ruby>乗<rt>じょう</rt></ruby><ruby>和<rt>わ</rt></ruby><b>96</b></span><span><ruby>標<rt>ひょう</rt></ruby><ruby>本<rt>ほん</rt></ruby><ruby>分<rt>ぶん</rt></ruby><ruby>散<rt>さん</rt></ruby>：÷25<b>3.84</b></span><span><ruby>不<rt>ふ</rt></ruby><ruby>偏<rt>へん</rt></ruby><ruby>分<rt>ぶん</rt></ruby><ruby>散<rt>さん</rt></ruby>：÷24<b>4</b></span></div></article><article class="worked"><h3>② 表の読み取り</h3><h4>① 与えられた条件 <span>Given</span></h4><p>95%の両側区間。n = 25。</p><h4>② 公式 <span>Formula</span></h4><div class="math">\[\nu=n-1,\qquad\alpha=\frac{1-0.95}{2}\]</div><h4>③ 代入・計算 <span>Substitute</span></h4><div class="math">\[\nu=24,\quad\alpha=0.025,\quad t_{0.025}(24)=2.0639\]</div><h4>④ 答え <span>Result</span></h4><p class="result"><ruby>自<rt>じ</rt></ruby><ruby>由<rt>ゆう</rt></ruby><ruby>度<rt>ど</rt></ruby>24の行 × 右側0.025の列 → 2.0639。</p><div class="lookup"><span>行<b>24</b></span><span>列：右側確率<b>0.025</b></span><span>交点<b>2.0639</b></span></div></article><article class="worked"><h3>③ <ruby>母<rt>ぼ</rt></ruby><ruby>平<rt>へい</rt></ruby><ruby>均<rt>きん</rt></ruby>の区間</h3><h4>① 与えられた条件 <span>Given</span></h4><p><ruby>標<rt>ひょう</rt></ruby><ruby>本<rt>ほん</rt></ruby><ruby>平<rt>へい</rt></ruby><ruby>均<rt>きん</rt></ruby>18分、<ruby>不<rt>ふ</rt></ruby><ruby>偏<rt>へん</rt></ruby><ruby>分<rt>ぶん</rt></ruby><ruby>散<rt>さん</rt></ruby>4分²、n = 25。</p><h4>② 公式 <span>Formula</span></h4><div class="math">\[\left[\bar X-t_{0.025}(n-1)\sqrt{\widehat{\sigma_x^2}/n},\ \bar X+t_{0.025}(n-1)\sqrt{\widehat{\sigma_x^2}/n}\right]\]</div><h4>③ 代入・計算 <span>Substitute</span></h4><div class="math">\[18\pm2.0639\sqrt{4/25}=18\pm2.0639\times0.4=18\pm0.82556\]</div><h4>④ 答え <span>Result</span></h4><p class="result">17.17〜18.83分。</p><figure><svg viewBox="0 0 1000 260" role="img" aria-label="信頼区間17.17から18.83分、点推定18"><line x1="60" x2="940" y1="150" y2="150" stroke="#9bafaf"/><line x1="330.7602000000001" x2="669.2397999999998" y1="100" y2="100" stroke="#d87b36" stroke-width="12" stroke-linecap="round"/><circle cx="500.0" cy="100" r="10" fill="#16776b"/><g text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#254954"><text x="330.7602000000001" y="195">17.17</text><text x="669.2397999999998" y="195">18.83</text><text x="500.0" y="50">点推定 18</text><text x="920" y="240">分</text></g></svg><figcaption>オレンジ：母数の<ruby>信<rt>しん</rt></ruby><ruby>頼<rt>らい</rt></ruby><ruby>区<rt>く</rt></ruby><ruby>間<rt>かん</rt></ruby>。青緑の点：点推定。</figcaption></figure></article></section><section id="q2" class="question"><h2><span>問2</span>Curryの得点のばらつき</h2><article class="worked"><h3>① 平均と<ruby>不<rt>ふ</rt></ruby><ruby>偏<rt>へん</rt></ruby><ruby>分<rt>ぶん</rt></ruby><ruby>散<rt>さん</rt></ruby></h3><h4>① 与えられた条件 <span>Given</span></h4><p>25、31、33、34、37点。n = 5。</p><h4>② 公式 <span>Formula</span></h4><div class="math">\[\bar X=\frac{\sum X_i}{n},\quad\widehat{\sigma_x^2}=\frac{\sum(X_i-\bar X)^2}{n-1}\]</div><h4>③ 代入・計算 <span>Substitute</span></h4><div class="math">\[\bar X=160/5=32,\qquad\widehat{\sigma_x^2}=80/4=20\]</div><h4>④ 答え <span>Result</span></h4><p class="result"><ruby>標<rt>ひょう</rt></ruby><ruby>本<rt>ほん</rt></ruby><ruby>平<rt>へい</rt></ruby><ruby>均<rt>きん</rt></ruby>32点、<ruby>偏<rt>へん</rt></ruby><ruby>差<rt>さ</rt></ruby><ruby>二<rt>に</rt></ruby><ruby>乗<rt>じょう</rt></ruby><ruby>和<rt>わ</rt></ruby>80点²、<ruby>不<rt>ふ</rt></ruby><ruby>偏<rt>へん</rt></ruby><ruby>分<rt>ぶん</rt></ruby><ruby>散<rt>さん</rt></ruby>20点²。</p><div class="table-wrap"><table><thead><tr><th>得点 Xᵢ</th><th>偏差 Xᵢ − 32</th><th>偏差二乗 (Xᵢ − 32)²</th></tr></thead><tbody><tr><td>25</td><td>-7</td><td>49</td></tr><tr><td>31</td><td>-1</td><td>1</td></tr><tr><td>33</td><td>1</td><td>1</td></tr><tr><td>34</td><td>2</td><td>4</td></tr><tr><td>37</td><td>5</td><td>25</td></tr></tbody><tfoot><tr><td>160</td><td>0</td><td>80</td></tr></tfoot></table></div></article><article class="worked"><h3>② 2つのχ²値</h3><h4>① 与えられた条件 <span>Given</span></h4><p>n = 5、95%区間。</p><h4>② 公式 <span>Formula</span></h4><div class="math">\[\nu=n-1,\quad\chi^2_{0.025}(\nu),\quad\chi^2_{0.975}(\nu)\]</div><h4>③ 代入・計算 <span>Substitute</span></h4><div class="math">\[\nu=4,\quad\chi^2_{0.025}(4)=11.1433,\quad\chi^2_{0.975}(4)=0.4844\]</div><h4>④ 答え <span>Result</span></h4><p class="result">大きい境界11.1433、小さい境界0.4844。どちらも右側確率。</p><div class="lookup"><span>右側0.025<b>11.1433</b></span><span>右側0.975<b>0.4844</b></span></div></article><article class="worked"><h3>③ <ruby>母<rt>ぼ</rt></ruby><ruby>分<rt>ぶん</rt></ruby><ruby>散<rt>さん</rt></ruby>の区間</h3><h4>① 与えられた条件 <span>Given</span></h4><p><ruby>偏<rt>へん</rt></ruby><ruby>差<rt>さ</rt></ruby><ruby>二<rt>に</rt></ruby><ruby>乗<rt>じょう</rt></ruby><ruby>和<rt>わ</rt></ruby>80点²、<ruby>自<rt>じ</rt></ruby><ruby>由<rt>ゆう</rt></ruby><ruby>度<rt>ど</rt></ruby>4。</p><h4>② 公式 <span>Formula</span></h4><div class="math">\[\left[\frac{\sum(X_i-\bar X)^2}{\chi^2_{0.025}(n-1)},\ \frac{\sum(X_i-\bar X)^2}{\chi^2_{0.975}(n-1)}\right]\]</div><h4>③ 代入・計算 <span>Substitute</span></h4><div class="math">\[\left[\frac{80}{11.1433},\frac{80}{0.4844}\right]\approx[7.18,165.15]\]</div><h4>④ 答え <span>Result</span></h4><p class="result">7.18〜165.15点²。分散の区間なので単位は点²。</p><figure><svg viewBox="0 0 1000 260" role="img" aria-label="信頼区間7.18から165.15点²、点推定20"><line x1="60" x2="940" y1="150" y2="150" stroke="#9bafaf"/><line x1="122.70525288239969" x2="842.3626020735848" y1="100" y2="100" stroke="#d87b36" stroke-width="12" stroke-linecap="round"/><circle cx="181.1111111111111" cy="100" r="10" fill="#16776b"/><g text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#254954"><text x="122.70525288239969" y="195">7.18</text><text x="842.3626020735848" y="195">165.15</text><text x="181.1111111111111" y="50">点推定 20</text><text x="920" y="240">点²</text></g></svg><figcaption>オレンジ：母数の<ruby>信<rt>しん</rt></ruby><ruby>頼<rt>らい</rt></ruby><ruby>区<rt>く</rt></ruby><ruby>間<rt>かん</rt></ruby>。青緑の点：点推定。</figcaption></figure></article></section><section id="q3" class="question"><h2><span>問3</span>ロボットの電池と標本数</h2><article class="worked"><h3>① 100台の場合</h3><h4>① 与えられた条件 <span>Given</span></h4><p><ruby>母<rt>ぼ</rt></ruby><ruby>標<rt>ひょう</rt></ruby><ruby>準<rt>じゅん</rt></ruby><ruby>偏<rt>へん</rt></ruby><ruby>差<rt>さ</rt></ruby>10分（既知）、平均120分、n = 100。</p><h4>② 公式 <span>Formula</span></h4><div class="math">\[\left[\bar X-1.96\sigma_x/\sqrt n,\ \bar X+1.96\sigma_x/\sqrt n\right]\]</div><h4>③ 代入・計算 <span>Substitute</span></h4><div class="math">\[120\pm1.96\frac{10}{\sqrt{100}}=120\pm1.96\]</div><h4>④ 答え <span>Result</span></h4><p class="result">118.04〜121.96分。</p><figure><svg viewBox="0 0 1000 260" role="img" aria-label="信頼区間118.04から121.96分、点推定120"><line x1="60" x2="940" y1="150" y2="150" stroke="#9bafaf"/><line x1="232.13333333333418" x2="767.8666666666659" y1="100" y2="100" stroke="#d87b36" stroke-width="12" stroke-linecap="round"/><circle cx="500.0" cy="100" r="10" fill="#16776b"/><g text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#254954"><text x="232.13333333333418" y="195">118.04</text><text x="767.8666666666659" y="195">121.96</text><text x="500.0" y="50">点推定 120</text><text x="920" y="240">分</text></g></svg><figcaption>オレンジ：母数の<ruby>信<rt>しん</rt></ruby><ruby>頼<rt>らい</rt></ruby><ruby>区<rt>く</rt></ruby><ruby>間<rt>かん</rt></ruby>。青緑の点：点推定。</figcaption></figure></article><article class="worked"><h3>② 400台の場合</h3><h4>① 与えられた条件 <span>Given</span></h4><p><ruby>母<rt>ぼ</rt></ruby><ruby>標<rt>ひょう</rt></ruby><ruby>準<rt>じゅん</rt></ruby><ruby>偏<rt>へん</rt></ruby><ruby>差<rt>さ</rt></ruby>10分（既知）、平均120分、n = 400。</p><h4>② 公式 <span>Formula</span></h4><div class="math">\[\left[\bar X-1.96\sigma_x/\sqrt n,\ \bar X+1.96\sigma_x/\sqrt n\right]\]</div><h4>③ 代入・計算 <span>Substitute</span></h4><div class="math">\[120\pm1.96\frac{10}{\sqrt{400}}=120\pm0.98\]</div><h4>④ 答え <span>Result</span></h4><p class="result">119.02〜120.98分。</p><figure><svg viewBox="0 0 1000 260" role="img" aria-label="信頼区間119.02から120.98分、点推定120"><line x1="60" x2="940" y1="150" y2="150" stroke="#9bafaf"/><line x1="366.06666666666615" x2="633.9333333333338" y1="100" y2="100" stroke="#d87b36" stroke-width="12" stroke-linecap="round"/><circle cx="500.0" cy="100" r="10" fill="#16776b"/><g text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#254954"><text x="366.06666666666615" y="195">119.02</text><text x="633.9333333333338" y="195">120.98</text><text x="500.0" y="50">点推定 120</text><text x="920" y="240">分</text></g></svg><figcaption>オレンジ：母数の<ruby>信<rt>しん</rt></ruby><ruby>頼<rt>らい</rt></ruby><ruby>区<rt>く</rt></ruby><ruby>間<rt>かん</rt></ruby>。青緑の点：点推定。</figcaption></figure></article><article class="worked"><h3>③ 幅の比較</h3><h4>① 与えられた条件 <span>Given</span></h4><p>100台の上<ruby>下<rt>か</rt></ruby><ruby>限<rt>げん</rt></ruby>118.04・121.96、400台の上<ruby>下<rt>か</rt></ruby><ruby>限<rt>げん</rt></ruby>119.02・120.98。</p><h4>② 公式 <span>Formula</span></h4><div class="math">\[\text{幅}=\text{上限}-\text{下限}\]</div><h4>③ 代入・計算 <span>Substitute</span></h4><div class="math">\[\frac{120.98-119.02}{121.96-118.04}=\frac{1.96}{3.92}=\frac12\]</div><h4>④ 答え <span>Result</span></h4><p class="result">標本数が4倍 → 区間の幅は半分。平均と<ruby>母<rt>ぼ</rt></ruby><ruby>分<rt>ぶん</rt></ruby><ruby>散<rt>さん</rt></ruby>が同じ場合。</p><div class="lookup"><span>100台の幅<b>3.92分</b></span><span>400台の幅<b>1.96分</b></span></div></article></section></main></template><script>document.querySelector('#unlock-form').addEventListener('submit',e=>{e.preventDefault();if(document.querySelector('#unlock-word').value.trim().toLowerCase()!=="stats"){document.querySelector('#unlock-error').textContent='合言葉を確認してください。';return;}document.querySelector('#gate').remove();const t=document.querySelector('#answer-content');document.body.insertBefore(t.content.cloneNode(true),t);document.querySelector('#answers-main').focus();if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise();});</script></body></html>
