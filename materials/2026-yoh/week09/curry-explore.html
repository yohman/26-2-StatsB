<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<script src="../../../assets/preview-access.js"></script>

<style>
:root{color-scheme:light;background:#fbfaf6;color:#22343b;--ink:#22343b;--muted:#54666d;--paper:#fff;--orange:#a84920;--wing:#c96530;--teal:#186a63;--violet:#624b8d;--rule:#e5e1d8;font:16px/1.45 system-ui,"Hiragino Sans",sans-serif}
*{box-sizing:border-box}body{margin:0}main{max-width:1260px;margin:auto;padding:clamp(12px,2.2vw,30px)}
h1,h2,p,figure{margin:0}h1{font-size:clamp(24px,4.4vw,46px);line-height:1.16;letter-spacing:-.032em}
.english{font-size:.75rem;color:var(--muted);margin-top:.3rem}article,aside{min-width:0}
button,input{font:inherit}a{color:var(--teal);text-underline-offset:.18em}button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.controls{display:flex;align-items:center;flex-wrap:wrap;gap:.4rem;margin:.95rem 0 1rem}
button{border:0;border-radius:6px;padding:.37rem .7rem;background:#ece9e0;color:var(--ink);font-size:.8rem;font-weight:650;cursor:pointer}
button:hover{background:#e3ded2}button.primary,button[aria-pressed=true]{background:var(--ink);color:white}button.primary:hover,button[aria-pressed=true]:hover{background:#354b53}
#reset{margin-left:auto;background:transparent;color:var(--muted)}.controls label{display:flex;align-items:center;gap:.4rem;font-size:.85rem}.controls output{font-weight:760;min-width:2.1ch}input[type=range]{width:clamp(8rem,20vw,15rem);accent-color:var(--wing)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.95fr);gap:clamp(12px,2.5vw,32px);align-items:start}
.visual{background:var(--paper);padding:clamp(11px,1.65vw,21px);border-radius:12px;text-align:center}
.sample{display:flex;align-items:baseline;flex-wrap:wrap;gap:.2rem .6rem;margin:0 0 .4rem}.sample-label,.label{font-size:.73rem;font-weight:700;color:var(--muted)}
.score{font-size:clamp(15px,2.4vw,24px);font-weight:750;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.facts{display:flex;flex-wrap:wrap;gap:.22rem .8rem;font-size:.78rem;margin-bottom:.55rem}.facts b{font-weight:780;margin-left:.25em;white-space:nowrap}
.mean{color:var(--orange)}.spread{color:var(--teal)}.critical{color:var(--violet)}
.formula{padding:.48rem 0}.formula+.formula{border-top:1px solid var(--rule)}
.math{display:flex;justify-content:center;align-items:center;min-height:3.05em;padding:.2em 0;font-size:clamp(16px,2.35vw,30px);overflow-x:auto}
.math math{min-width:max-content;margin:auto}.formula.chi .math{font-size:clamp(14px,2.05vw,26px)}
.margin,.note,footer,figcaption{color:var(--muted);font-size:.77rem}.margin{margin:.15rem 0 .2rem}.margin strong{color:var(--ink)}
.result-label{font-size:.8rem;font-weight:680;color:var(--muted)}.result{display:block;font-size:clamp(23px,4.25vw,48px);font-weight:800;letter-spacing:-.045em;color:var(--orange);font-variant-numeric:tabular-nums;line-height:1.15;margin:.24rem 0 .4rem}.result small{font-size:.42em;letter-spacing:0}
.chart{display:block;width:100%;height:auto;overflow:visible}.axis{stroke:#c2caca;stroke-width:1}.tick{fill:#556a70;font-size:13px}.wing{stroke:var(--wing);stroke-linecap:round;stroke-width:3.6;fill:none}.wing.faint{stroke:#adbbb8;stroke-width:2}.dot{fill:var(--wing)}.dot.faint{fill:#adbbb8}.reference{stroke:var(--teal);stroke-width:1.25;stroke-dasharray:4 4}.reference-label{fill:var(--teal);font-size:13px;font-weight:700}.plot-label{font-size:13px;fill:var(--ink);font-weight:650}.emphasis{font-weight:780;fill:var(--orange)}
.chart .wing.active{transform-box:fill-box;transform-origin:center;animation:wings .24s ease-out both}@keyframes wings{from{opacity:.35;transform:scaleX(.82)}to{opacity:1;transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){.chart .wing.active{animation:none}}
.count{font-size:.79rem;margin-top:.55rem;color:var(--teal)}.count strong{font-size:1.09rem}.legend{margin:.3rem 0 0}
details{margin:.25rem 0 0;font-size:.77rem}summary{cursor:pointer;color:var(--teal);width:max-content;max-width:100%;padding:.26em 0}details .math{font-size:clamp(14px,1.85vw,22px);justify-content:start}details .math math{margin:0}details .note{margin:.14rem 0}
footer{margin-top:.7rem}footer p+p{margin-top:.22rem}
body.embedded main{max-width:1120px}body.embedded h1{font-size:clamp(23px,3.1vw,39px)}
@media(max-width:670px){.layout{grid-template-columns:1fr;gap:.65rem}.visual{grid-row:1}.math{font-size:clamp(16px,4.7vw,27px)}.formula.chi .math{font-size:clamp(14px,4.15vw,24px)}.controls{margin:.65rem 0}.result{font-size:clamp(24px,6vw,38px)}}
</style>
</head>
<body><main>
<header><h1 id="title"></h1><p id="english" class="english"></p></header>
<div class="controls" id="controls" aria-label="実験の条件"></div>
<div class="layout">
  <article aria-label="公式と計算">
    <div id="inputs"></div>
    <div id="rule"></div>
    <div id="substitution"></div>
    <details><summary id="detail-label">途中の計算</summary><div id="detail"></div></details>
  </article>
  <figure class="visual" aria-labelledby="figure-title">
    <p class="result-label" id="figure-title"></p><output class="result" id="result" aria-live="polite"></output>
    <div id="chart"></div><figcaption id="caption"></figcaption>
  </figure>
</div>
<footer id="foot"></footer>
</main>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  'use strict';
  const M=window.FutureStats,$=id=>document.getElementById(id);
  const models={
    curry:['Curryの5試合','Population mean · Student’s t'],
    coverage:['100本のうち、何本が届く？','Long-run coverage'],
    'mean-ci':['信頼係数で、幅はどう変わる？','Confidence level'],
    size:['標本数で、幅はどう変わる？','Sample size · Known population variance'],
    'variance-ci':['母分散の左右の翼','Population variance · Chi-square']
  };
  const params=new URLSearchParams(location.search),mode=params.get('mode');
  if(params.has('embed'))document.body.classList.add('embedded');
  const active=Object.hasOwn(models,mode)?mode:'curry',coverage=active==='coverage',confidence=active==='mean-ci',sizeMode=active==='size',chi=active==='variance-ci';
  const example=[23,29,31,32,35],mu=30;
  let sample=example,n=25,level=95,one=false,history=[],total=0,hits=0,run=0;
  const fix=(x,d=2)=>x.toFixed(d),trim=(x,d=4)=>String(+x.toFixed(d)),rounded=(x,d=4)=>+x.toFixed(d);
  const game=()=>rounded(mu+Math.sqrt(20)*M.normal(),1);
  const math=s=>'<div class="math"><math display="block">'+s+'</math></div>';
  const tag=(t,s)=>'<'+t+'>'+s+'</'+t+'>',i=s=>tag('mi',s),v=s=>tag('mn',s),o=s=>tag('mo',s),r=(...s)=>tag('mrow',s.join(''));
  const sub=(a,b)=>tag('msub',a+b),sup=(a,b)=>tag('msup',a+b),frac=(a,b)=>tag('mfrac',a+b),root=s=>tag('msqrt',s),accent=(a,b)=>'<mover accent="true">'+a+o(b)+'</mover>';
  const color=(s,c)=>'<mstyle class="'+c+'">'+s+'</mstyle>';
  const par=s=>r(o('('),s,o(')')),br=(a,b)=>o('[')+a+o(',')+b+o(']');
  const xbar=accent(i('x'),'¯'),xi=sub(i('x'),i('i')),sig=sup(sub(i('σ'),i('x')),v(2)),hat=accent(sig,'^'),nn=i('n'),df=r(nn,o('−'),v(1)),diff=sup(par(r(xi,o('−'),xbar)),v(2)),sum=r(o('∑'),diff);
  const t=sub(i('t'),i('α'))+par(df),qchi=a=>sub(sup(i('χ'),v(2)),v(a))+par(df);
  const meanRule=(m,q,s,N,{numeric=false}={})=>{
    const center=color(m,'mean'),critical=color(q,'critical'),spread=color(root(frac(s,N)),'spread');
    return br(r(center,o('−'),critical,numeric?o('×'):'',spread),r(center,o('+'),critical,numeric?o('×'):'',spread));
  };
  const chiRule=(ss,a,b)=>br(frac(color(ss,'spread'),color(r(a),'critical')),frac(color(ss,'spread'),color(r(b),'critical')));
  const pair=(label,expression,tail='')=>'<div class="formula'+(chi?' chi':'')+'"><p class="label">'+label+'</p>'+math(expression)+tail+'</div>';
  const fact=(label,value,c)=>'<span class="'+c+'">'+label+'<b>'+value+'</b></span>';
  const calcMean=(s,c)=>{
    // Use the same four-decimal percentile as the printed upper-tail table.
    const a=(100-c)/200,q=rounded(M.tq(a,s.df));const w=q*s.se;
    return {mean:s.mean,lo:s.mean-w,hi:s.mean+w,q,w,a,c};
  };
  function calculate(s){
    if(sizeMode){
      const m=120,q=1.96,variance=100,w=q*Math.sqrt(variance/n);
      return {mean:m,lo:m-w,hi:m+w,q,w,c:95,a:.025};
    }
    if(chi){
      const a=rounded(M.chiq(.025,s.df)),b=rounded(M.chiq(.975,s.df));
      return {mean:s.s2,lo:s.ss/a,hi:s.ss/b,a,b,c:95};
    }
    return calcMean(s,level);
  }
  function scale(rows,min,max){
    const all=rows.flatMap(a=>[a.lo,a.hi,a.mean]);
    const lo=Math.min(min,...all),hi=Math.max(max,...all),start=40,end=460;
    return {lo,hi,start,end,x:z=>start+(end-start)*(z-lo)/(hi-lo)};
  }
  function axis({lo,hi,x,start,end},y,unit,ticks=[]){
    return '<path class="axis" d="M'+start+' '+y+'H'+end+'"/>'+ticks.filter(k=>lo<=k&&k<=hi).map(k=>'<path class="axis" d="M'+x(k)+' '+y+'v5"/><text class="tick" x="'+x(k)+'" y="'+(y+20)+'" text-anchor="middle">'+k+'</text>').join('')+'<text class="tick" x="488" y="'+(y+20)+'" text-anchor="end">'+unit+'</text>';
  }
  function wing(rec,y,x,{faint=false,thin=false,animate=false}={}){
    const a=x(rec.lo),b=x(rec.hi),m=x(rec.mean),cap=thin?0:faint?5:8;
    return '<path class="wing'+(faint?' faint':'')+(animate?' active':'')+'"'+(thin?' style="stroke-width:1.6"':'')+' d="M'+a+' '+y+'H'+b+' M'+a+' '+(y-cap)+'v'+(2*cap)+' M'+b+' '+(y-cap)+'v'+(2*cap)+'"/><circle class="dot'+(faint?' faint':'')+'" cx="'+m+'" cy="'+y+'" r="'+(thin?1.25:faint?3.5:6)+'"/>';
  }
  function graph(rec){
    const unit=chi?'点²':sizeMode?'分':'点';
    if(one){
      const s=scale([rec],15,45);
      return '<svg class="chart" viewBox="0 0 490 104" role="img" aria-label="1試合の得点。区間なし。"><circle class="dot" r="7" cy="40" cx="'+s.x(rec.mean)+'"/>'+axis(s,67,unit,[15,20,25,30,35,40,45])+'</svg>';
    }
    const compare=confidence?[90,95,99].map(c=>calcMean(M.summary(sample),c)):sizeMode?[rec,{mean:120,w:1.96,lo:118.04,hi:121.96}]:[];
    if(sizeMode&&n===100)compare[1]={mean:120,w:3.92,lo:116.08,hi:123.92};
    const many=coverage?history:active==='curry'&&history.length>1?history:[];
    const showRuns=many.length>0;
    const s=scale([rec,...compare,...many],chi?0:sizeMode?108:15,chi?Math.max(180,Math.ceil(rec.hi/50)*50):sizeMode?132:45),x=s.x;
    const ticks=chi?[0,1,2,3,4].map(k=>k*(s.hi>200?Math.round(s.hi/5/25)*25:40)):sizeMode?[110,115,120,125,130]:[15,20,25,30,35,40,45];
    const start=showRuns?83:compare.length?27:47,yAxis=showRuns?225:compare.length?start+compare.length*38:80;
    let plot='';
    if(showRuns||coverage){
      plot=(coverage?'<path class="reference" d="M'+x(mu)+' 21V'+yAxis+'"/><text class="reference-label" x="'+x(mu)+'" y="14" text-anchor="middle">μₓ = 30</text>':'')+
        wing(rec,40,x,{animate:run>0,faint:coverage&&history.at(-1)?.miss})+
        (showRuns?'<text class="tick" x="5" y="70">直近'+many.length+'組</text>':'')+
        many.map((a,j)=>wing(a,start+(j+.5)*132/many.length,x,{faint:a.miss,thin:many.length>15})).join('');
    } else if(compare.length){
      plot=compare.map((a,j)=>{
        const pos=start+j*38,selected=confidence?a.c===level:j===0;
        return '<text class="plot-label'+(selected?' emphasis':'')+'" x="3" y="'+(pos-10)+'">'+(confidence?a.c+'%':'n = '+(j===0?n:n===100?25:100))+'</text>'+wing(a,pos,x,{faint:!selected,animate:selected&&!sizeMode&&run>0});
      }).join('');
    } else {
      plot=wing(rec,start,x,{animate:run>0});
      const labels=[{at:x(rec.lo),value:rec.lo},{at:x(rec.mean),value:rec.mean},{at:x(rec.hi),value:rec.hi}];
      if(labels[1].at-labels[0].at>53&&labels[2].at-labels[1].at>53)plot+=labels.map(a=>'<text class="plot-label emphasis" x="'+a.at+'" y="26" text-anchor="middle">'+fix(a.value)+'</text>').join('');
      else plot+='<text class="plot-label emphasis" x="'+x(rec.mean)+'" y="26" text-anchor="middle">'+fix(rec.mean)+'</text>';
    }
    const alt=coverage?'破線は真の母平均30点。各横線は95%区間。':chi?'点は不偏分散。左右非対称の区間。':'橙の点は標本平均。両端は信頼区間の下限と上限。';
    return '<svg class="chart" viewBox="0 0 490 '+(yAxis+28)+'" role="img" aria-label="'+alt+'">'+plot+axis(s,yAxis,unit,ticks)+'</svg>';
  }
  function details(s,rec){
    if(sizeMode)return '<p class="note">教科書 p.125 の標準化を母平均 μₓ について整理すると、上の区間の式になります。</p>'+
      math(r(i('Z'),o('='),frac(r(xbar,o('−'),sub(i('μ'),i('x'))),root(frac(sig,nn)))))+
      '<p class="note">母標準偏差10分 → 母分散100分²。標本数だけを変えます。</p>'+
      math(r(root(frac(sig,nn)),o('='),root(frac(v(100),v(n))),o('≈'),v(fix(10/Math.sqrt(n),4))));
    if(one)return '<p class="note">1試合では標本不偏分散の分母が0になるため、tで幅を計算できません。</p>';
    const xs=sample.map(x=>v(x)).reduce((a,b)=>a+o('+')+b);
    const meanLine=math(r(xbar,o('='),frac(tag('munderover',o('∑')+r(i('i'),o('='),v(1))+nn)+xi,nn),o('='),frac(r(xs),v(s.n)),o('='),v(trim(s.mean,2))));
    const terms=sample.map(x=>sup(par(r(v(x),o('−'),v(trim(s.mean,2)))),v(2))).reduce((a,b)=>a+o('+')+b);
    const ssLine=math(r(sum,o('='),terms,o('='),v(trim(s.ss,6))));
    const s2Line=math(r(hat,o('='),frac(v(1),df),tag('munderover',o('∑')+r(i('i'),o('='),v(1))+nn),diff))+
      math(r(hat,o('='),frac(v(1),r(v(s.n),o('−'),v(1))),o('×'),v(trim(s.ss,6)),o('='),v(trim(s.s2,6))));
    return (chi?ssLine:meanLine+ssLine)+s2Line;
  }
  function render(){
    const s=sizeMode?null:M.summary(sample),rec=one?{mean:sample[0],lo:sample[0],hi:sample[0]}:calculate(s);
    const unit=chi?'点²':sizeMode?'分':'点';
    $('inputs').innerHTML=(sizeMode?'':'<div class="sample"><span class="sample-label">'+(one?'1試合':'5試合')+'の得点</span>'+sample.map(x=>'<span class="score">'+trim(x,1)+'</span>').join('')+'</div>')+
      '<div class="facts">'+(sizeMode?fact('標本平均','120分','mean')+fact('母分散','100分²','spread')+fact('標本数',n,'spread'):
      one?fact('標本数',1,'spread')+fact('自由度',0,'critical'):
      (chi?fact('偏差二乗和',trim(s.ss)+'点²','spread'):fact('標本平均',trim(s.mean,2)+'点','mean')+fact('不偏分散',trim(s.s2)+'点²','spread'))+fact('自由度',s.df,'critical'))+'</div>';
    $('rule').innerHTML=chi?pair('教科書の式 · p.136',chiRule(sum,qchi('0.025'),qchi('0.975'))):
      pair(sizeMode?'母分散が既知の場合 · 教科書 pp.125・133 から':'教科書の式 · p.133',meanRule(xbar,sizeMode?sub(i('z'),i('α')):t,sizeMode?sig:hat,nn));
    $('substitution').innerHTML=one?'<p class="note">自由度 0。点は出せますが、翼（信頼区間）は作れません。</p>':
      chi?pair('今回の数値を代入',chiRule(v(trim(s.ss)),v(fix(rec.a,4)),v(fix(rec.b,4))),'<p class="margin">同じ分子。大きい χ² 値が<strong>下限</strong>の分母。</p>'):
      pair('今回の数値を代入',meanRule(v(sizeMode?120:trim(s.mean,2)),v(fix(rec.q,sizeMode?2:4)),v(sizeMode?100:trim(s.s2,6)),v(sizeMode?n:s.n),{numeric:true}),
        '<p class="margin">片側の幅 <strong>'+fix(rec.w,4)+unit+'</strong> ／ 上側確率 α = '+trim(rec.a,3)+'</p>');
    $('detail').innerHTML=details(s,rec);
    $('figure-title').textContent=one?'1試合の得点 · 区間なし':(chi?'母分散':'母平均')+'の'+rec.c+'%信頼区間'+(coverage||active==='curry'&&history.length>1?' · 最新の1組':'');
    $('result').innerHTML=(one?trim(rec.mean,1):fix(rec.lo)+' – '+fix(rec.hi))+' <small>'+unit+'</small>';
    $('chart').innerHTML=graph(rec);
    $('caption').innerHTML=one?'点：この1試合の得点。':coverage?
      (total?'<p class="count">30点を含む：<strong>'+hits+' / '+total+'組（'+fix(100*hits/total,1)+'%）</strong></p>':'<p>最初はスライドの1組。抽出ボタンで区間を増やす。</p>')+
      '<p class="legend">橙：30点を含む ／ 灰：含まない ／ 破線：真の母平均'+(total>100?'（直近100組を表示）':'')+'</p>':
      confidence?'3本とも同じ5試合。橙：選んだ信頼係数。':sizeMode?'橙：現在の標本数。全幅 '+fix(2*rec.w)+'分。':chi?'点：不偏分散 '+fix(rec.mean)+'点²。区間の真ん中ではない。':'点：標本平均 '+fix(rec.mean)+'点 ／ 翼の先：下限と上限'+(history.length>1?' ／ 下に直近'+history.length+'組':'');
    document.querySelectorAll('[data-level]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.level===level)));
    if($('size')){$('size').value=n;$('size-value').textContent=n;}
  }
  function draw(count){
    one=false;level=95;
    if(!coverage)history=[];
    for(let j=0;j<count;j++){
      sample=Array.from({length:5},game);
      if(coverage||active==='curry'){
        const rec=calcMean(M.summary(sample),95),miss=mu<rec.lo||mu>rec.hi;
        history.push({...rec,miss:coverage&&miss});
        if(coverage){total++;if(!miss)hits++;}
      }
    }
    history=history.slice(-100);
  }
  const btn=(type,label,value='',cls='')=>'<button type="button" class="'+cls+'" data-'+type+'="'+value+'">'+label+'</button>';
  const link=(href,label)=>'<a href="'+href+'" target="_blank" rel="noopener">'+label+' ↗</a>';
  $('title').textContent=models[active][0];$('english').textContent=models[active][1];document.title=models[active][0]+' · Week 9';
  $('controls').innerHTML=(confidence?[90,95,99].map(c=>btn('level',c+'%',c)).join('')+btn('sample','別の5試合'):
    sizeMode?'<label for="size">標本数 <input id="size" type="range" min="5" max="100" value="25"><output id="size-value" for="size">25</output></label>'+btn('n','25台',25)+btn('n','100台',100):
    btn('draw','5試合を抽出',1,'primary')+(chi?'':btn('draw','10組',10)+btn('draw','100組',100))+(active==='curry'?btn('one','1試合だけ'):''))+
    '<button type="button" id="reset" title="スライドの例に戻す">↺ リセット</button>';
  $('controls').addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.draw)draw(+b.dataset.draw);
    if('one' in b.dataset){one=true;sample=[game()];}
    if('sample' in b.dataset)sample=Array.from({length:5},game);
    if(b.dataset.level)level=+b.dataset.level;
    if(b.dataset.n)n=+b.dataset.n;
    if(b.id==='reset'){sample=example;one=false;level=95;n=25;history=[];hits=total=0;run=0;}
    else run++;
    render();
  });
  $('size')?.addEventListener('input',e=>{n=+e.target.value;render();});
  $('foot').innerHTML='<p>'+(sizeMode?'教科書 pp.125・133、p.202 · '+link('../week05/normal-upper-tail-table.html?p','標準正規分布表'):
   chi?'教科書 pp.135–136 · '+link('../shared/chi-table.html?p','χ²分布表'):'教科書 pp.132–135 · '+link('../week06/t-table.html?p','t分布表'))+'</p>'+
