<!doctype html>
<html lang="ja" data-language="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Preview · 2026–2 Statistics B</title>
  <link rel="icon" href="favicon.svg?v=20260927-b-mark-1" type="image/svg+xml">
  <link rel="stylesheet" href="assets/stats-styles.css?v=20260909">
  <link rel="stylesheet" href="assets/viewer-context.css?v=20261006-slide-swipe-1">
</head>
<body class="viewer-page">
  <header class="site-header"><a class="wordmark" href="index.html"><img src="favicon.svg?v=20260927-b-mark-1" alt="" width="42" height="42">2026–2 Statistics B</a><div class="header-tools"><button class="language-toggle" type="button" data-language-toggle aria-label="Switch to English">EN</button></div></header>
  <main class="viewer-main wrap">
    <a class="viewer-back" data-viewer-back href="agenda.html"><span aria-hidden="true">←</span><span class="lang-en">BACK</span><span class="lang-ja" lang="ja">戻る</span></a>
    <div class="viewer-top"><div><p class="eyebrow"><span class="lang-en">FILE PREVIEW</span><span class="lang-ja" lang="ja">資料プレビュー</span></p><h1 data-viewer-title>Course file</h1></div><div class="viewer-actions"><a data-download href="#" download><span class="lang-en">DOWNLOAD</span><span class="lang-ja" lang="ja">ダウンロード</span> ↓</a></div></div>
    <div data-viewer-content></div>
    <section class="viewer-links" data-viewer-links hidden>
      <h2>Links</h2>
      <a href="https://www.rossmanchance.com/applets/2021/montyhall/Monty.html" target="_blank" rel="noopener noreferrer">Monty Hall simulator <span aria-hidden="true">↗</span></a>
    </section>
  </main>
  <script src="assets/vendor/pdfjs/pdf.min.js?v=3.11.174"></script>
  <script src="assets/slide-browsing.js?v=20261006-slide-swipe-1"></script>
  <script>
    const parameters = new URLSearchParams(location.search);
    const file = parameters.get('file') || '';
    const source = parameters.get('source') || '';
    const title = parameters.get('title') || file.split('/').pop() || 'Course file';
    const week = parameters.get('week') || '';
    const requestedReturn = parameters.get('return') || '';
    const returnTo = requestedReturn.startsWith('agenda.html') ? requestedReturn : 'agenda.html';
    const fullTitle = week ? `${week} · ${title}` : title;
    document.title = `${fullTitle} · Preview`;
    document.querySelector('[data-viewer-title]').textContent = fullTitle;
    document.querySelector('[data-download]').href = encodeURI(file);
    if (/\.pdf$/i.test(file)) document.querySelector('[data-download]').innerHTML = '<span class="lang-en">DOWNLOAD PDF</span><span class="lang-ja" lang="ja">PDFをダウンロード</span> ↓';
    if (/\.xlsx$/i.test(source)) {
      document.querySelector('[data-download]').href = encodeURI(source);
      document.querySelector('[data-download]').innerHTML = '<span class="lang-en">DOWNLOAD XLSX</span><span class="lang-ja" lang="ja">XLSXをダウンロード</span> ↓';
      const note = document.createElement('p');
      note.innerHTML = '<span class="lang-en">Read-only worksheet preview. Download the Excel file to fill in your answers.</span><span class="lang-ja" lang="ja">ワークシートの閲覧用プレビューです。解答を入力するにはExcelファイルをダウンロードしてください。</span>';
      document.querySelector('.viewer-top').after(note);
    }
    if (/\.pptx$/i.test(source)) {
      const sourceDownload = document.createElement('a');
      sourceDownload.href = encodeURI(source);
      sourceDownload.download = '';
      sourceDownload.innerHTML = '<span class="lang-en">DOWNLOAD PPTX</span><span class="lang-ja" lang="ja">PPTXをダウンロード</span> ↓';
      document.querySelector('.viewer-actions').append(sourceDownload);
    }
    const backLink = document.querySelector('[data-viewer-back]');
    backLink.href = returnTo;
    backLink.addEventListener('click', event => {
      if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || history.length <= 1) return;
      event.preventDefault();
      history.back();
    });
    const content = document.querySelector('[data-viewer-content]');
    if (week === 'W01' && /\/(?:w1|w3)\.pdf$/i.test(file)) {
      document.querySelector('[data-viewer-links]').hidden = false;
    }
    const showFileNote = () => {
      content.innerHTML = `<div class="viewer-file-note"><p class="eyebrow">${(file.split('.').pop() || 'FILE').toUpperCase()}</p><h2>This file opens after download.</h2><p>Download the source file to use it in its matching application.</p></div>`;
    };
    const showPdfFallback = () => {
      content.innerHTML = `<div class="viewer-file-note"><h2>PDF preview could not load.</h2><p>Please use the download button to open the PDF directly.</p></div>`;
    };
    const makeLabel = (en, ja) => `<span class="lang-en">${en}</span><span class="lang-ja" lang="ja">${ja}</span>`;
    async function renderPdfPreview(path) {
      const viewer = document.createElement('section');
      viewer.className = 'pdf-viewer';
      const toolbar = document.createElement('div');
      toolbar.className = 'pdf-toolbar';
      const previous = document.createElement('button');
      previous.type = 'button';
      previous.innerHTML = makeLabel('PREVIOUS', '前へ');
      const pageStatus = document.createElement('p');
      pageStatus.className = 'pdf-status';
      const next = document.createElement('button');
      next.type = 'button';
      next.innerHTML = makeLabel('NEXT', '次へ');
      const navigation = document.createElement('div');
      navigation.className = 'pdf-navigation';
      navigation.append(previous, pageStatus, next);
      const fullscreen = document.createElement('button');
      fullscreen.type = 'button';
      fullscreen.className = 'pdf-fullscreen';
      fullscreen.innerHTML = makeLabel('FULL SCREEN', '全画面');
      fullscreen.setAttribute('aria-pressed', 'false');
      fullscreen.disabled = true;
      toolbar.append(navigation, fullscreen);
      const canvasWrap = document.createElement('div');
      canvasWrap.className = 'pdf-canvas-wrap';
      const pageSurface = document.createElement('div');
      pageSurface.className = 'pdf-page';
      const canvas = document.createElement('canvas');
      canvas.className = 'pdf-canvas';
      const linkLayer = document.createElement('div');
      linkLayer.className = 'pdf-link-layer';
      pageSurface.append(canvas, linkLayer);
      canvasWrap.append(pageSurface);
      viewer.append(toolbar, canvasWrap);
      content.replaceChildren(viewer);
      try {
        if (!window.pdfjsLib) throw new Error('PDF renderer unavailable');
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'assets/vendor/pdfjs/pdf.worker.min.js?v=3.11.174';
        const pdfUrl = new URL(encodeURI(path), location.href);
        if (/^materials\/2026-yoh\/week0[23]\/w[23]\.pdf$/.test(path)) pdfUrl.searchParams.set('v', '20261007-al2-formula-1');
        const response = await fetch(pdfUrl.href, { cache: 'no-cache' });
        if (!response.ok) throw new Error('PDF unavailable');
        const pdf = await window.pdfjsLib.getDocument({
          data: await response.arrayBuffer(),
          docBaseUrl: new URL(encodeURI(path), location.href).href
        }).promise;
        let activePage = Math.max(1, Math.min(pdf.numPages, parseInt(parameters.get('page'), 10) || 1));
        let renderQueue = Promise.resolve();
        const isFullscreen = () => document.fullscreenElement === viewer || viewer.classList.contains('is-fullscreen-fallback');
        const openDestination = async destination => {
          const target = typeof destination === 'string' ? await pdf.getDestination(destination) : destination;
          if (!Array.isArray(target)) return;
          const pageIndex = Number.isInteger(target[0]) ? target[0] : await pdf.getPageIndex(target[0]);
          if (pageIndex >= 0 && pageIndex < pdf.numPages) renderPage(pageIndex + 1);
        };
        const renderLinks = async (page, viewport) => {
          linkLayer.replaceChildren();
          const annotations = await page.getAnnotations({ intent: 'display' });
          for (const annotation of annotations) {
            if (annotation.subtype !== 'Link' || !annotation.rect) continue;
            const rectangle = viewport.convertToViewportRectangle(annotation.rect);
            const [x1, y1, x2, y2] = rectangle;
            const left = Math.max(0, Math.min(x1, x2));
            const top = Math.max(0, Math.min(y1, y2));
            const right = Math.min(viewport.width, Math.max(x1, x2));
            const bottom = Math.min(viewport.height, Math.max(y1, y2));
            if (right <= left || bottom <= top) continue;
            const link = document.createElement('a');
            link.className = 'pdf-page-link';
            link.style.left = `${left / viewport.width * 100}%`;
            link.style.top = `${top / viewport.height * 100}%`;
            link.style.width = `${(right - left) / viewport.width * 100}%`;
            link.style.height = `${(bottom - top) / viewport.height * 100}%`;
            if (annotation.url) {
              let destination;
              try {
                destination = new URL(annotation.url, location.href);
              } catch {
                continue;
              }
              if (!['http:', 'https:', 'mailto:'].includes(destination.protocol)) continue;
              if (destination.hostname === 'yohman.github.io' && destination.pathname === '/26-2-StatsB/agenda.html') {
                const courseAgenda = new URL('agenda.html', location.href);
                courseAgenda.search = destination.search;
                courseAgenda.hash = destination.hash;
                if (new URLSearchParams(location.search).get('preview') === 'all') courseAgenda.searchParams.set('preview', 'all');
                destination = courseAgenda;
              }
              link.href = destination.href;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              link.title = destination.href;
              link.setAttribute('aria-label', `Open link: ${destination.href}`);
            } else if (annotation.dest) {
              link.href = '#';
              link.setAttribute('aria-label', 'Go to linked PDF page');
              link.addEventListener('click', event => {
                event.preventDefault();
                openDestination(annotation.dest).catch(console.error);
              });
            } else {
              continue;
            }
            linkLayer.append(link);
          }
        };
        const renderPage = requestedPage => {
          activePage = requestedPage;
          renderQueue = renderQueue.catch(() => {}).then(async () => {
            linkLayer.replaceChildren();
            const page = await pdf.getPage(requestedPage);
            const baseViewport = page.getViewport({ scale: 1 });
            const availableWidth = Math.max(320, Math.min(1400, canvasWrap.clientWidth - 32));
            const availableHeight = Math.max(200, canvasWrap.clientHeight - 32);
            const scale = isFullscreen()
              ? Math.min(2.5, availableWidth / baseViewport.width, availableHeight / baseViewport.height)
              : Math.min(1.7, availableWidth / baseViewport.width);
            const viewport = page.getViewport({ scale });
            const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.floor(viewport.width * pixelRatio);
            canvas.height = Math.floor(viewport.height * pixelRatio);
            canvas.style.width = `${Math.floor(viewport.width)}px`;
            canvas.style.height = `${Math.floor(viewport.height)}px`;
            pageSurface.style.width = canvas.style.width;
            pageSurface.style.height = canvas.style.height;
            const context = canvas.getContext('2d');
            context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
            await page.render({ canvasContext: context, viewport }).promise;
            await renderLinks(page, viewport);
            pageStatus.textContent = `${requestedPage} / ${pdf.numPages}`;
            previous.disabled = requestedPage === 1;
            next.disabled = requestedPage === pdf.numPages;
          });
          return renderQueue;
        };
        const syncFullscreen = () => {
          const expanded = isFullscreen();
          fullscreen.innerHTML = expanded ? makeLabel('EXIT FULL SCREEN', '全画面を終了') : makeLabel('FULL SCREEN', '全画面');
          fullscreen.setAttribute('aria-pressed', String(expanded));
          renderPage(activePage);
        };
        const exitFallbackFullscreen = () => {
          viewer.classList.remove('is-fullscreen-fallback');
          document.body.classList.remove('pdf-preview-expanded');
          syncFullscreen();
        };
        fullscreen.addEventListener('click', async () => {
          if (document.fullscreenElement === viewer) {
            await document.exitFullscreen();
          } else if (viewer.classList.contains('is-fullscreen-fallback')) {
            exitFallbackFullscreen();
          } else {
            try {
              if (!viewer.requestFullscreen) throw new Error('Fullscreen unavailable');
              await viewer.requestFullscreen();
            } catch {
              viewer.classList.add('is-fullscreen-fallback');
              document.body.classList.add('pdf-preview-expanded');
              syncFullscreen();
            }
          }
        });
        document.addEventListener('fullscreenchange', syncFullscreen);
        fullscreen.disabled = false;
        const showPreviousPage = () => activePage > 1 && renderPage(activePage - 1);
        const showNextPage = () => activePage < pdf.numPages && renderPage(activePage + 1);
        previous.addEventListener('click', showPreviousPage);
        next.addEventListener('click', showNextPage);
        window.bindSlideSwipe(canvasWrap, showPreviousPage, showNextPage);
        document.addEventListener('keydown', event => {
          const target = event.target;
          const isEditing = target instanceof HTMLElement &&
            (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName));
          if (isEditing || event.altKey || event.ctrlKey || event.metaKey) return;
          if (event.key === 'Escape' && viewer.classList.contains('is-fullscreen-fallback')) {
            event.preventDefault();
            exitFallbackFullscreen();
            return;
          }
          if (event.key === 'ArrowLeft') {
            event.preventDefault();
            showPreviousPage();
          } else if (event.key === 'ArrowRight') {
            event.preventDefault();
            showNextPage();
          }
        });
        await renderPage(activePage);
      } catch (error) {
        console.error('PDF preview failed:', error);
        showPdfFallback();
      }
    }
    if (/^assets\/worksheet-previews\/w\d{2}\/index\.html$/.test(file)) {
      const frame = document.createElement('iframe');
      frame.src = file;
      frame.title = fullTitle;
      frame.sandbox = '';
      frame.style.cssText = 'width:100%;height:76vh;min-height:450px;border:1px solid #d8cdbd;background:white';
      content.replaceChildren(frame);
    }
    else if (/\.pdf$/i.test(file)) renderPdfPreview(file);
    else showFileNote();
  </script>
  <script src="assets/stats-site.js?v=20260915-tsumura-materials-v2"></script>
</body>
</html>
